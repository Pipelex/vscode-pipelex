[workspace]
exclude = ["util/test-gen"]
members = ["crates/*"]

resolver = "2"

[workspace.package]
authors      = ["Evotis S.A.S. <oss@pipelex.com>", "tamasfe"]
edition      = "2021"
license      = "MIT"
rust-version = "1.88"
homepage     = "https://docs.pipelex.com/"
repository   = "https://github.com/Pipelex/vscode-pipelex"

[workspace.dependencies]
ahash              = { version = "0.8.4" }
anyhow             = { version = "1.0.53" }
arc-swap           = { version = "1.5.0" }
async-trait        = { version = "0.1.92" }
clap               = { version = "4.5.31", default-features = false, features = ["std"] }
either             = { version = "1.6.1" }
futures            = { version = "0.3.30" }
getrandom          = { version = "0.2", default-features = false }
glob               = { version = "0.3" }
globset            = { version = "0.4.8" }
hex                = { version = "0.4" }
indexmap           = { version = "2.2" }
itertools          = { version = "0.10.3" }
lsp-types          = { version = "0.93.0" }
once_cell          = { version = "1.4" }
parking_lot        = { version = "0.12.0" }
regex              = { version = "1.5" }
rowan              = { version = "0.15.3" }
schemars           = { version = "0.8.3" }
serde              = { version = "1" }
serde_json         = { version = "1.0.78" }
sha1               = { version = "0.10.5" }
tap                = { version = "1.0.1" }
thiserror          = { version = "1.0.30" }
time               = { version = "0.3.7" }
tokio              = { version = "1.24.2", default-features = false }
toml               = { version = "0.7" }
tracing            = { version = "0.1.30" }
tracing-subscriber = { version = "0.3.7" }
url                = { version = "2.2.2" }

# reqwest 0.11 always built in charset decoding, HTTP/2 and the system proxy
# settings, where 0.12 makes each one a default feature: they are named here to
# keep them. Each crate's `native-tls` or `rustls-tls` feature picks the TLS, and
# reqwest's `rustls-tls` still means the webpki root store, on the ring provider.
[workspace.dependencies.reqwest]
version          = "0.12.28"
default-features = false
features         = ["charset", "http2", "system-proxy"]

[workspace.lints.clippy]
arc_with_non_send_sync = "allow"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = 3
strip         = true


[profile.bench]
lto       = true
opt-level = 3
