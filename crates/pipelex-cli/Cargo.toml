[package]
name         = "pipelex-cli"
description  = "Pipelex Tools CLI (plxt) - wraps taplo-cli with MTHDS support"
version      = "0.10.0"
rust-version = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
homepage     = { workspace = true }
repository   = { workspace = true }

[features]
default = ["completions", "lint", "lsp", "rustls-tls", "usage-stats"]
lint = [
  "dep:url",
  "reqwest",
  "taplo-cli/lint",
  "taplo-common/reqwest",
  "taplo-common/schema",
]
lsp = ["async-ctrlc", "lint", "taplo-cli/lsp", "taplo-lsp"]
native-tls = ["taplo-common/native-tls", "taplo-lsp?/native-tls"]
rustls-tls = ["taplo-common/rustls-tls", "taplo-lsp?/rustls-tls"]
completions = ["dep:clap_complete"]
# Anonymous usage statistics of the native `plxt` binary (conformance's
# usage-statistics contract): the `usage-stats` command group, the notice, the
# spool and its detached sender. Off in the WASM builds, which take no default
# features, since only the native CLI reports.
usage-stats = [
  "dep:filetime",
  "dep:getrandom",
  "dep:serde_json",
  "dep:time",
  "reqwest",
]

[dependencies]
pipelex-common = { version = "0.1.0", path = "../pipelex-common" }
taplo-cli      = { version = "0.10.0", path = "../taplo-cli", default-features = false }
taplo-common   = { version = "0.6.0", path = "../taplo-common" }
taplo-lsp      = { version = "0.8.0", path = "../taplo-lsp", default-features = false, optional = true }

anyhow     = { workspace = true }
clap       = { workspace = true, features = ["derive", "cargo", "env", "default"] }
filetime   = { version = "0.2", optional = true }
getrandom  = { workspace = true, optional = true, features = ["std"] }
serde_json = { workspace = true, optional = true }
time       = { workspace = true, optional = true }
toml       = { version = "0.7" }
tracing    = { workspace = true }
url        = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
lsp-async-stub = { version = "0.7.0", path = "../lsp-async-stub", features = [
  "tokio-tcp",
  "tokio-stdio",
] }

async-ctrlc   = { version = "1.2.0", features = ["stream"], optional = true }
clap_complete = { version = "4.4.18", optional = true }

tokio = { workspace = true, features = [
  "sync",
  "fs",
  "time",
  "io-std",
  "macros",
  "rt-multi-thread",
  "parking_lot",
  "signal",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio   = { workspace = true, features = ["sync", "parking_lot", "io-util"] }
reqwest = { workspace = true, features = ["json"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies.reqwest]
workspace = true
features  = ["json"]
optional  = true

[[bin]]
name = "plxt"
path = "bin/plxt.rs"

[dev-dependencies]
# Parity tests (tests/parity.rs) compare the in-process `pipelex_tools` library
# against the shipped `plxt` binary. They live here — not in `pipelex-py` —
# because only the bin-owning crate gets `CARGO_BIN_EXE_plxt`. The `python`
# feature stays OFF, so this dev-dep is pure Rust (no PyO3) and never reaches the
# `plxt` binary (dev-dependencies are compiled only for test/bench targets).
pipelex-py = { path = "../pipelex-py" }
# The usage-statistics contract tests read the vendored schema and match its
# patterns, and drive the binary against a local capture server.
regex      = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
