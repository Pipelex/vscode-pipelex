[package]
name         = "pipelex-common"
description  = "Shared code for Pipelex tools (wraps taplo-common with MTHDS environment)."
version      = "0.1.0"
rust-version = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }

[features]
# The shared MTHDS lint/format engine (`tools` module) — the single impl behind
# the `pipelex-tools-py` wheel and the `@pipelex/tools-wasm` npm package.
# `taplo-common/schema` has no reqwest-free build (`Schemas` holds an
# `Option<reqwest::Client>` unconditionally), so `reqwest` must ride along; the
# engine never constructs a client (`http: None`), keeping it provably offline.
# `rustls-tls` rides along too: taplo-common's no-TLS `get_certs` fallback does
# not compile (pre-existing upstream signature bug in a never-built combo), and
# this matches the feature set the wheel always shipped with.
tools = [
  "dep:serde",
  "taplo-common/reqwest",
  "taplo-common/rustls-tls",
  "taplo-common/schema",
]

[dependencies]
taplo        = { version = "0.14.0", path = "../taplo", features = ["serde"] }
taplo-common = { version = "0.6.0", path = "../taplo-common" }

anyhow      = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
serde       = { workspace = true, features = ["derive"], optional = true }
time        = { workspace = true }
tracing     = { workspace = true }
url         = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "parking_lot",
  "rt",
  "sync",
  "time",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { workspace = true, features = ["io-util", "parking_lot", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
