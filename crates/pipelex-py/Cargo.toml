[package]
name         = "pipelex-py"
description  = "Python bindings for Pipelex Tools — MTHDS lint & format as an importable library"
version      = "0.1.3"
publish      = false
rust-version = { workspace = true }
authors      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
homepage     = { workspace = true }
repository   = { workspace = true }

[lib]
# `name` is the Python module name; cdylib for maturin, rlib so `cargo test` can link the impls.
name       = "pipelex_tools"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The shared lint/format engine; this crate is only the PyO3 glue over it.
pipelex-common = { path = "../pipelex-common", features = ["tools"] }

serde = { workspace = true, features = ["derive"] }

pyo3 = { version = "0.23", features = [
  "abi3-py38",
  "extension-module",
  "generate-import-lib",
], optional = true }
pythonize = { version = "0.23", optional = true }

[features]
python = ["dep:pyo3", "dep:pythonize"]

[lints]
workspace = true
