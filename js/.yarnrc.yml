nodeLinker: node-modules

npmPublishAccess: public

npmRegistryServer: "https://registry.npmjs.org"

# @wasm-tool/rollup-plugin-rust 3 declares binaryen as a peer dependency, for
# wasm-opt. Every rollup config here sets `optimize.wasmOpt: false` (the 2.x
# builds never ran wasm-opt either, since yarn never put binaryen's bin on the
# PATH), so the peer is optional and leaving it unprovided is deliberate.
packageExtensions:
  "@wasm-tool/rollup-plugin-rust@*":
    peerDependenciesMeta:
      binaryen:
        optional: true

yarnPath: .yarn/releases/yarn-4.0.2.cjs
